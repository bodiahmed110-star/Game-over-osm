    <script>
        const firebaseConfig = { databaseURL: "https://game-over-osm-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function getTitleAndClass(trophies) {
            if (trophies >= 5) return { text: "الإمبراطور الأسطوري للمنصة", class: "title-5" };
            if (trophies == 4) return { text: "مهندس التكتيك الذهبي العالمي", class: "title-4" };
            if (trophies == 3) return { text: "جنرال الساحة وصائد القمم", class: "title-3" };
            if (trophies == 2) return { text: "الفارس النبيل ملك الخطط", class: "title-2" };
            return { text: "البطل المتألق النزيه", class: "title-1" };
        }

        database.ref('legends').on('child_added', function(snapshot) {
            const data = snapshot.val();
            const list = document.getElementById('legendsList');
            const badge = getTitleAndClass(data.trophies);
            const newCard = document.createElement('div');
            newCard.className = 'legend-card';
            newCard.innerHTML = `
                <div class="legend-info">
                    <span class="legend-name">${data.name}</span>
                    <span class="legend-title ${badge.class}">${badge.text}</span>
                </div>
                <div class="legend-trophies">
                    <span class="trophy-text">x${data.trophies}</span>🏆
                </div>
            `;
            list.insertBefore(newCard, list.firstChild);
        });

        database.ref('teams').on('child_added', function(snapshot) {
            const data = snapshot.val();
            const list = document.getElementById('teamsList');
            const newCard = document.createElement('div');
            newCard.className = 'legend-card';
            newCard.innerHTML = `
                <div class="legend-info">
                    <span class="legend-name">${data.name}</span>
                    <span class="team-members">الأعضاء: ${data.members}</span>
                </div>
                <div class="legend-trophies">🥇</div>
            `;
            list.insertBefore(newCard, list.firstChild);
        });

        database.ref('remontada').on('child_added', function(snapshot) {
            const data = snapshot.val();
            const list = document.getElementById('remontadaList');
            const newCard = document.createElement('div');
            newCard.className = 'legend-card';
            newCard.innerHTML = `
                <div class="legend-info">
                    <span class="legend-name">${data.name}</span>
                    <span class="legend-title team-remontada">ملك العودة التاريخية</span>
                </div>
                <div class="legend-trophies">🔄</div>
            `;
            list.insertBefore(newCard, list.firstChild);
        });
