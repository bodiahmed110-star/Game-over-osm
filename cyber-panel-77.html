<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME OVER OSM - Cyber Control Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #03060f; color: #ffffff; min-height: 100vh; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .panel-container { width: 100%; max-width: 600px; background: rgba(11, 15, 25, 0.9); border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 24px; padding: 30px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px); }
        .panel-title { text-align: center; font-size: 2rem; font-weight: 900; color: #00d2ff; text-shadow: 0 0 10px rgba(0, 102, 255, 0.5); }
        .panel-subtitle { text-align: center; font-size: 0.8rem; color: #ff3b30; font-weight: bold; letter-spacing: 2px; margin-bottom: 25px; }
        .section-box { background: rgba(18, 21, 32, 0.7); border: 1px solid rgba(255, 255, 255, 0.03); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        .section-title { font-size: 1.1rem; font-weight: 700; color: #ffea00; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: #a0aec0; font-weight: 600; }
        input[type="text"], input[type="number"] { width: 100%; background-color: #070913; border: 1px solid rgba(0, 210, 255, 0.15); border-radius: 10px; padding: 12px 15px; color: #ffffff; font-size: 1rem; outline: none; }
        input:focus { border-color: #00d2ff; box-shadow: 0 0 10px rgba(0, 210, 255, 0.2); }
        .submit-btn { width: 100%; background: linear-gradient(135deg, #00d2ff, #0066ff); color: white; border: none; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5); }
        .alert { display: none; text-align: center; padding: 10px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; margin-top: 10px; }
        .alert-success { background-color: rgba(37, 211, 102, 0.15); color: #25d366; border: 1px solid rgba(37, 211, 102, 0.3); }
        .data-list { max-height: 200px; overflow-y: auto; background: #070913; border-radius: 10px; padding: 10px; margin-top: 15px; }
        .data-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .data-item:last-child { border-bottom: none; }
        .delete-btn { background: #ff3b30; color: white; border: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .delete-btn:hover { background: #d32f2f; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>
    <div class="panel-container">
        <h1 class="panel-title">لوحة التحكم السيبرانية المحدثة</h1>
        <p class="panel-subtitle">SECURE ACCESS & MANAGEMENT</p>

        <div class="section-box">
            <h2 class="section-title">🏆 إدارة قائمة الأساطير</h2>
            <div class="form-group">
                <label>اسم المدرب:</label>
                <input type="text" id="coachName" placeholder="أدخل اسم المدرب">
            </div>
            <div class="form-group">
                <label>عدد البطولات الجديد:</label>
                <input type="number" id="coachTrophies" min="1" placeholder="مثال: 5">
            </div>
            <button class="submit-btn" onclick="addLegend()">إضافة / تحديث البيانات</button>
            <div class="alert alert-success" id="alertLegend">تم الحفظ بنجاح!</div>
            <div class="data-list" id="manageLegends"></div>
        </div>

        <div class="section-box">
            <h2 class="section-title">⚔️ إدارة سجل أبطال التيمات</h2>
            <div class="form-group">
                <label>اسم التيم الفائز:</label>
                <input type="text" id="teamName" placeholder="مثال: الكتيبة الذهبية">
            </div>
            <div class="form-group">
                <label>أسماء أعضاء التيم:</label>
                <input type="text" id="teamMembers" placeholder="أحمد، محمد، علي">
            </div>
            <button class="submit-btn" style="background: linear-gradient(135deg, #00ffcc, #00aa88); color: #03060f;" onclick="addTeam()">تسجيل التيم</button>
            <div class="alert alert-success" id="alertTeam">تم تسجيل التيم!</div>
            <div class="data-list" id="manageTeams"></div>
        </div>

        <div class="section-box">
            <h2 class="section-title">🔮 إدارة سجل الريمونتادا</h2>
            <div class="form-group">
                <label>اسم بطل الريمونتادا:</label>
                <input type="text" id="remontadaName" placeholder="أدخل اسم المدرب">
            </div>
            <button class="submit-btn" style="background: linear-gradient(135deg, #d300ff, #7700aa);" onclick="addRemontada()">تسجيل البطل</button>
            <div class="alert alert-success" id="alertRemontada">تم التسجيل بنجاح!</div>
            <div class="data-list" id="manageRemontada"></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://game-over-osm-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function showAlert(id) {
            const el = document.getElementById(id); el.style.display = 'block';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        }

        function addLegend() {
            const name = document.getElementById('coachName').value.trim();
            const trophies = parseInt(document.getElementById('coachTrophies').value);
            if(!name || isNaN(trophies)) return alert("أدخل بيانات صحيحة");
            database.ref('legends').push({ name, trophies }).then(() => {
                showAlert('alertLegend'); document.getElementById('coachName').value=""; document.getElementById('coachTrophies').value="";
            });
        }

        function addTeam() {
            const name = document.getElementById('teamName').value.trim();
            const members = document.getElementById('teamMembers').value.trim();
            if(!name || !members) return alert("أدخل بيانات صحيحة");
            database.ref('teams').push({ name, members }).then(() => {
                showAlert('alertTeam'); document.getElementById('teamName').value=""; document.getElementById('teamMembers').value="";
            });
        }

        function addRemontada() {
            const name = document.getElementById('remontadaName').value.trim();
            if(!name) return alert("أدخل الاسم");
            database.ref('remontada').push({ name }).then(() => {
                showAlert('alertRemontada'); document.getElementById('remontadaName').value="";
            });
        }

        function setupManagement(path, containerId, displayFn) {
            database.ref(path).on('value', snapshot => {
                const container = document.getElementById(containerId);
                container.innerHTML = "";
                snapshot.forEach(child => {
                    const data = child.val();
                    const div = document.createElement('div');
                    div.className = 'data-item';
                    div.innerHTML = `<span>${displayFn(data)}</span> <button class="delete-btn" onclick="deleteItem('${path}', '${child.key}')">حذف ❌</button>`;
                    container.appendChild(div);
                });
            });
        }

        function deleteItem(path, key) { if(confirm("هل أنت متأكد من الحذف؟")) database.ref(`${path}/${key}`).remove(); }

        setupManagement('legends', 'manageLegends', d => `${d.name} (${d.trophies} بطولة)`);
        setupManagement('teams', 'manageTeams', d => `${d.name} - الأعضاء: ${d.members}`);
        setupManagement('remontada', 'manageRemontada', d => d.name);
    </script>
</body>
</html>
